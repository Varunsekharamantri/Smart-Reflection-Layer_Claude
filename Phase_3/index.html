<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude - Reasoning Inspection Layer with Visual Connectors</title>
  
  <!-- Premium Editorial Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SVG Global Glow Filters Definition -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
    <defs>
      <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur2" />
        <feMerge>
          <feMergeNode in="blur1" />
          <feMergeNode in="blur2" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>

  <!-- Premium Mobile Frame Wrapper (centered on desktop, fluid on mobile) -->
  <div class="device-wrapper">
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg class="status-svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <svg class="status-svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.53c-.26-.81-1-1.4-1.9-1.4h-1v-3c0-.55-.45-1-1-1h-6v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.4z"/></svg>
        <svg class="status-svg" viewBox="0 0 24 24"><path fill="currentColor" d="M17 5H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z"/></svg>
      </div>
    </div>

    <!-- Application Body -->
    <div class="chat-app-container">
      
      <!-- Top Navigation Header -->
      <header class="app-header">
        <button class="header-action-btn" id="menu-btn" aria-label="Open navigation menu">
          <svg viewBox="0 0 24 24" class="header-icon"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        
        <div class="app-brand">
          <svg class="brand-logo" viewBox="0 0 100 100" aria-hidden="true">
            <path fill="currentColor" d="M47.7,13.7C46.9,8,53.1,8,52.3,13.7l-2,14c-.1.8-.7,1.4-1.5,1.4s-1.4-.7-1.5-1.4L47.7,13.7z M30,19.2c2.9-4.9,8.3-1.8,5.4,3.1l-7,12.1c-.4.7-1.2.9-1.9.5s-.9-1.2-.5-1.9L30,19.2z M17,35.4c4.9-2.9,8,2.3,3.1,5.2l-12.1,7c-.7.4-1.6.2-2-.5s-.2-1.6.5-2L17,35.4z M13.7,52.3C8,53.1,8,46.9,13.7,47.7l14,2c.8.1,1.4.7,1.4,1.5s-.7,1.4-1.4,1.4L13.7,52.3z M19.2,70c-4.9-2.9-1.8-8.3,3.1-5.4l12.1,7c.7.4.9,1.2.5,1.9s-1.2.9-1.9.5L19.2,70z M35.4,83c-2.9-4.9,2.3-8,5.2-3.1l7,12.1c.4.7.2,1.6-.5,2s-1.6.2-2-.5L35.4,83z M52.3,86.3c.8,5.7-5.4,5.7-4.6,0l2-14c.1-.8.7-1.4,1.5-1.4s1.4.7,1.4,1.4L52.3,86.3z M70,80.8c-2.9,4.9-8.3,1.8-5.4-3.1l7-12.1c.4-.7,1.2-.9,1.9-.5s.9,1.2.5,1.9L70,80.8z M83,64.6c-4.9,2.9-8-2.3-3.1-5.2l12.1-7c.7-.4,1.6-.2,2,.5s.2,1.6-.5,2L83,64.6z M86.3,47.7c5.7-.8,5.7,5.4,0,4.6l-14-2c-.8-.1-1.4-.7-1.4-1.5s.7-1.4,1.4-1.4L86.3,47.7z M80.8,30c4.9,2.9,1.8,8.3-3.1,5.4l-12.1-7c-.7-.4-.9-1.2-.5-1.9s1.2-.9,1.9-.5L80.8,30z M64.6,17c2.9,4.9-2.3,8-5.2,3.1l-7-12.1c-.4-.7-.2-1.6.5-2s1.6-.2,2,.5L64.6,17z"/>
          </svg>
          <span class="brand-text">Claude</span>
        </div>
        
        <button class="header-action-btn" id="new-draft-btn" aria-label="Start new draft">
          <svg viewBox="0 0 24 24" class="header-icon"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
      </header>

      <!-- Scrollable Message Feed -->
      <main class="chat-viewport" id="chat-viewport">
        <div class="chat-thread">
          
          <!-- User Prompt Card -->
          <div class="message user-message-wrapper">
            <div class="user-avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="avatar-svg"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="user-prompt-card">
              <p class="user-prompt-text" id="user-prompt-content">Should I prioritize PLG growth for our B2B SaaS product?</p>
            </div>
          </div>

          <!-- Assistant Response (with inline highlights & expandable reflection drawer) -->
          <div class="message assistant-message-wrapper">
            <div class="assistant-avatar" aria-hidden="true">
              <div class="brand-avatar-glow">
                <svg viewBox="0 0 100 100" class="brand-avatar-svg"><path fill="currentColor" d="M47.7,13.7C46.9,8,53.1,8,52.3,13.7l-2,14c-.1.8-.7,1.4-1.5,1.4s-1.4-.7-1.5-1.4L47.7,13.7z M30,19.2c2.9-4.9,8.3-1.8,5.4,3.1l-7,12.1c-.4.7-1.2.9-1.9.5s-.9-1.2-.5-1.9L30,19.2z M17,35.4c4.9-2.9,8,2.3,3.1,5.2l-12.1,7c-.7.4-1.6.2-2-.5s-.2-1.6.5-2L17,35.4z M13.7,52.3C8,53.1,8,46.9,13.7,47.7l14,2c.8.1,1.4.7,1.4,1.5s-.7,1.4-1.4,1.4L13.7,52.3z M19.2,70c-4.9-2.9-1.8-8.3,3.1-5.4l12.1,7c.7.4.9,1.2.5,1.9s-1.2.9-1.9.5L19.2,70z M35.4,83c-2.9-4.9,2.3-8,5.2-3.1l7,12.1c.4.7.2,1.6-.5,2s-1.6.2-2-.5L35.4,83z M52.3,86.3c.8,5.7-5.4,5.7-4.6,0l2-14c.1-.8.7-1.4,1.5-1.4s1.4.7,1.4,1.4L52.3,86.3z M70,80.8c-2.9,4.9-8.3,1.8-5.4-3.1l7-12.1c.4-.7,1.2-.9,1.9-.5s.9,1.2.5,1.9L70,80.8z M83,64.6c-4.9,2.9-8-2.3-3.1-5.2l12.1-7c.7-.4,1.6-.2,2,.5s.2,1.6-.5,2L83,64.6z M86.3,47.7c5.7-.8,5.7,5.4,0,4.6l-14-2c-.8-.1-1.4-.7-1.4-1.5s.7-1.4,1.4-1.4L86.3,47.7z M80.8,30c4.9,2.9,1.8,8.3-3.1,5.4l-12.1-7c-.7-.4-.9-1.2-.5-1.9s1.2-.9,1.9-.5L80.8,30z M64.6,17c2.9,4.9-2.3,8-5.2,3.1l-7-12.1c-.4-.7-.2-1.6.5-2s1.6-.2,2,.5L64.6,17z"/></svg>
              </div>
            </div>
            
            <div class="assistant-bubble-container" id="assistant-bubble-container">
              
              <!-- ======================================================= -->
              <!-- CONNECTOR CANVAS overlay stretched to capture coordinate spans -->
              <!-- ======================================================= -->
              <svg id="connector-canvas" class="connector-canvas" aria-hidden="true">
                <!-- Dynamically drawing Bezier Curves via JavaScript -->
              </svg>
              <!-- ======================================================= -->

              <!-- AI Core Response Paragraph Content -->
              <div class="response-text-wrapper" id="response-content-area">
                <p class="loading-placeholder-text">Analyzing reasoning vectors and parsing structured data...</p>
              </div>
              
              <!-- Quick Interaction toolbar -->
              <div class="response-action-toolbar">
                <button class="tool-btn" aria-label="Copy response">
                  <svg viewBox="0 0 24 24" class="tool-icon"><path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
                <button class="tool-btn" aria-label="Thumbs up">
                  <svg viewBox="0 0 24 24" class="tool-icon"><path fill="currentColor" d="M1 21h4V9H1v12zm22-10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                </button>
                <button class="tool-btn" aria-label="Thumbs down">
                  <svg viewBox="0 0 24 24" class="tool-icon"><path fill="currentColor" d="M19 15h4V3h-4v12zm-4 2c0 1.1-.9 2-2 2H4c-.83 0-1.54-.5-1.84-1.22l-3.02-7.05C.05 10.5.01 10.27.01 10V8c0-1.1.9-2 2-2h6.31L7.37 1.43c-.02-.1-.03-.2-.03-.3 0-.55.45-1 1-1l3.5 3.5 5.59 5.59c.37.37.57.87.57 1.42v5z"/></svg>
                </button>
                <button class="tool-btn" aria-label="Share">
                  <svg viewBox="0 0 24 24" class="tool-icon"><path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                </button>
              </div>

              <!-- SMART REFLECTION LAYER (Interactive DOM Workspace Container) -->
              <div class="reflection-drawer-container collapsed" id="reflection-drawer">
                
                <!-- Toggle Expansion Trigger Bar -->
                <button class="reflection-trigger-bar" id="reflection-trigger-btn" aria-expanded="false" aria-controls="reflection-accordion-wrapper">
                  <div class="trigger-label-group">
                    <div class="shield-icon-wrapper">
                      <svg class="shield-svg" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <div class="trigger-text-wrapper">
                      <span class="trigger-title">Reflection Mode Active</span>
                      <span class="trigger-subtitle">Reasoning inspection and judgment layer</span>
                    </div>
                  </div>
                  <!-- Connector hook target on the header for closed state -->
                  <div class="trigger-action-group" id="header-connector-anchor">
                    <svg class="chevron-svg" viewBox="0 0 24 24"><path fill="currentColor" d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
                  </div>
                </button>

                <!-- Expanded Accordion Content -->
                <div class="reflection-accordion-wrapper" id="reflection-accordion-wrapper">
                  <div class="accordion-inner-content">
                    
                    <!-- Module 1: Assumptions Detected -->
                    <div class="reflection-card-accordion collapsed" id="card-assumptions" data-hl-target="hl-1">
                      <button class="card-trigger">
                        <div class="card-title-group">
                          <div class="card-icon-frame color-orange">
                            <svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                          </div>
                          <span class="card-heading-title">1. Assumptions Detected</span>
                          <span class="badge-tag tag-orange">Reasoning inspection</span>
                        </div>
                        <svg class="card-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                      </button>
                      <div class="card-body-wrapper">
                        <div class="card-body-content" id="content-assumptions">
                          <!-- Filled dynamically by JavaScript -->
                        </div>
                      </div>
                    </div>

                    <!-- Module 2: Missing Context -->
                    <div class="reflection-card-accordion collapsed" id="card-context">
                      <button class="card-trigger">
                        <div class="card-title-group">
                          <div class="card-icon-frame color-yellow">
                            <svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H5c0-3.87 3.13-7 7-7s7 3.13 7 7c0 1.17-.45 2.23-1.17 3.07z"/></svg>
                          </div>
                          <span class="card-heading-title">2. Missing Context</span>
                          <span class="badge-tag tag-yellow">Potential context gap</span>
                        </div>
                        <svg class="card-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                      </button>
                      <div class="card-body-wrapper">
                        <div class="card-body-content" id="content-context">
                          <!-- Filled dynamically by JavaScript -->
                        </div>
                      </div>
                    </div>

                    <!-- Module 3: Uncertainty Boundary -->
                    <div class="reflection-card-accordion collapsed" id="card-uncertainty">
                      <button class="card-trigger">
                        <div class="card-title-group">
                          <div class="card-icon-frame color-purple">
                            <svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                          </div>
                          <span class="card-heading-title">3. Uncertainty Boundary</span>
                          <span class="badge-tag tag-purple">Confidence consideration</span>
                        </div>
                        <svg class="card-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                      </button>
                      <div class="card-body-wrapper">
                        <div class="card-body-content" id="content-uncertainty">
                          <!-- Filled dynamically by JavaScript -->
                        </div>
                      </div>
                    </div>

                    <!-- Module 4: Alternative Perspectives -->
                    <div class="reflection-card-accordion collapsed" id="card-alternatives" data-hl-target="hl-2">
                      <button class="card-trigger">
                        <div class="card-title-group">
                          <div class="card-icon-frame color-green">
                            <svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M22 9V7h-2V5c0-1.1-.9-2-2-2h-2V1h-2v2H8V1H6v2H4c-1.1 0-2 .9-2 2v2H0v2h2v4H0v2h2v2c0 1.1.9 2 2 2h2v2h2v-2h8v2h2v-2h2c1.1 0 2-.9 2-2v-2h2v-2h-2v-4h2zm-4 8H6V7h12v10z"/></svg>
                          </div>
                          <span class="card-heading-title">4. Alternative Perspective</span>
                          <span class="badge-tag tag-green">Alternative interpretation</span>
                        </div>
                        <svg class="card-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                      </button>
                      <div class="card-body-wrapper">
                        <div class="card-body-content" id="content-alternatives">
                          <!-- Filled dynamically by JavaScript -->
                        </div>
                      </div>
                    </div>

                    <!-- Module 5: Reflection Prompt -->
                    <div class="reflection-card-accordion collapsed" id="card-prompt">
                      <button class="card-trigger">
                        <div class="card-title-group">
                          <div class="card-icon-frame color-red">
                            <svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6C8.62 12.07 8 10.59 8 9c0-2.21 1.79-4 4-4s4 1.79 4 4c0 1.59-.62 3.07-1.15 4.1z"/></svg>
                          </div>
                          <span class="card-heading-title">5. Reflection Prompt</span>
                          <span class="badge-tag tag-red">Deeper evaluation</span>
                        </div>
                        <svg class="card-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                      </button>
                      <div class="card-body-wrapper">
                        <div class="card-body-content" id="content-prompt">
                          <!-- Filled dynamically by JavaScript -->
                        </div>
                      </div>
                    </div>

                  </div>
                </div>

              </div>
              <!-- ======================================================= -->

            </div>
          </div>

        </div>
      </main>

      <!-- Bottom Chat Inputs -->
      <footer class="chat-footer-bar">
        <div class="input-actions-wrapper">
          <button class="footer-action-btn" id="attach-btn" aria-label="Upload document/files">
            <svg viewBox="0 0 24 24" class="footer-icon"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          
          <div class="text-input-frame">
            <textarea class="chat-text-area" id="prompt-input" rows="1" placeholder="Message Claude..."></textarea>
          </div>
          
          <button class="footer-action-btn speech-wave-btn" id="speech-btn" aria-label="Audio record">
            <svg viewBox="0 0 24 24" class="footer-icon"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
          </button>
        </div>
      </footer>

    </div>
  </div>

  <!-- Core Client Controller -->
  <script src="app.js"></script>
</body>
</html>
